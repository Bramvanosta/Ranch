# The Rust every build uses: contributors (rustup reads this file), CI, the
# release builds and the server image (Dockerfile). mise.toml names the same
# version. To bump: change it here, in mise.toml, in the Dockerfile's
# `rust:` image and in the workflows' `toolchain:` inputs, in one commit.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
