# CI: the gate of every pull request, and of main.
#  - frontend   Biome, types, unit tests, no credentials in SQL migrations
#  - migrations pull requests only: no shipped SQL migration changes
#  - overflow   no clipped or overlapping text, in Playwright's own image
#  - server     the Rust core with the `server` feature (the Docker image's binary)
#  - desktop    the Rust core with the `desktop` feature (Tauri), integration tests included
#  - image      pull requests only: the server image, built and smoke-tested
#               (on main, image.yml builds, tests and pushes it)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A new push to a pull request makes its previous run moot; main runs to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info in CI builds: the desktop job links some thirty test binaries,
  # each carrying all of Tauri: with debug info the linkers run out of memory
  # (`ld terminated with signal 9`); without it the builds are also faster.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - name: No credentials in SQL migrations
        run: bash scripts/check-no-creds-in-sql.sh
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test

  migrations:
    # sqlx refuses to start when an applied migration's file changed: a
    # shipped migration is never edited (scripts/check-migrations-unchanged.sh).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          # The base branch and the release tags, to compare with.
          fetch-depth: 0
      - name: No shipped migration changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-migrations-unchanged.sh "origin/$BASE_REF"

  playwright-version:
    # The overflow job's image must carry the browsers of the @playwright/test
    # that pnpm installs: its tag is read from package.json, never typed twice.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: read
        run: |
          set -eu
          V=$(node -p 'require("./package.json").devDependencies["@playwright/test"]')
          # An image tag is one exact version: a range would not name one.
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "@playwright/test must be pinned to an exact version (found \"$V\")"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

  overflow:
    # No clipped or overlapping text on any screen of Ranch web.
    # Playwright's own image carries Chromium and its system libraries.
    needs: playwright-version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
        with:
          setup-node: "false"
      - name: Overflow check
        run: pnpm check:overflow
        env:
          CI: "1"

  server:
    # The HTTP shell (the Docker image's binary): built and tested WITHOUT the
    # desktop feature: no WebKit, no libdbus, nothing to apt-get.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # rust-toolchain.toml's version (mise.toml and the release builds use it too).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: server
      - name: Format
        run: cargo fmt --check
      - name: Clippy (server)
        run: cargo clippy --locked --workspace --no-default-features --features server --lib --bins -- -D warnings
      - name: "Tests (server): every command served over HTTP or desktop-only"
        run: cargo test --locked --workspace --no-default-features --features server --lib

  desktop:
    # The desktop app's backend: everything, including the UI/MCP parity
    # contract and the integration tests, against a real Redis seeded with
    # BullMQ queues, and with real BullMQ 5 and 6 workers processing what
    # Ranch writes (the *_live and *_compat_live suites). The slow one.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 15
    env:
      RANCH_LOCAL_REDIS: "1"
      RANCH_REDIS_PORT: "6379"
      RANCH_BULLMQ_COMPAT: "1"
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Tauri system dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri
          key: desktop
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Seed BullMQ queues, install the BullMQ 5 and 6 workers
        working-directory: .
        run: |
          (cd .docker/bullmq-seed && npm install --no-progress --no-audit --no-fund \
            && REDIS_URL=redis://127.0.0.1:6379 node seed.mjs)
          (cd .docker/bullmq-compat && npm ci --no-audit --no-fund)
      - name: Clippy (desktop)
        run: |
          # Tauri embeds the frontend bundle at compile time: any index.html will do here.
          mkdir -p ../dist && echo '<!doctype html>' > ../dist/index.html
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests (desktop)
        run: |
          # Dependencies and the library at full speed, then the integration
          # tests three at a time: linking them all at once can run a runner
          # out of memory.
          cargo test --locked --workspace --lib --no-run
          cargo test --locked --workspace --no-run -j 3
          cargo test --locked --workspace
      - name: Tests against Redis and BullMQ workers
        # The *_live suites are #[ignore]d without a Redis (they say so);
        # here they run, the BullMQ compatibility suites included.
        run: cargo test --locked --test '*_live' -- --include-ignored

  image:
    # Pull requests only: on main, image.yml builds, tests and pushes.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          # A plain single-platform image in the local daemon, for the smoke test.
          provenance: false
          tags: ranch:ci
          # Layers shared with image.yml's amd64 build: a pull request reuses main's.
          cache-from: type=gha,scope=server-image-amd64
          cache-to: type=gha,scope=server-image-amd64,mode=max
      - name: Smoke test
        run: sh scripts/smoke-test-image.sh ranch:ci
