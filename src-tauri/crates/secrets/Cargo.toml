# The adapters of the `SecretStore` port. Each shell enables the store it
# needs: `os-keychain` for the desktop app and `ranch-mcp`, `file` for Ranch
# server.
[package]
name = "ranch-secrets"
description = "Where Ranch keeps secrets: the OS keychain, a file in the data volume, or memory"
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
os-keychain = ["dep:keyring"]
file = ["dep:chacha20poly1305", "dep:base64", "dep:sha2", "dep:serde", "dep:serde_json"]

[dependencies]
ranch-domain = { workspace = true }
ranch-application = { workspace = true }
# OS keychain: pure-Rust crypto on Linux (no system OpenSSL), native backends mac/Windows.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"], optional = true }
# Secrets at rest in the data volume (there is no OS keychain in a container).
chacha20poly1305 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
