# Toolchain versions pinned for Ranch.
# Every contributor and CI uses these exact versions.
# Install with: mise install
#
# Bump node by editing here, run `mise install`, commit the change. Rust is
# rust-toolchain.toml's version: bump it there (it says where else).

[tools]
rust = "1.99.1" # same as rust-toolchain.toml
node = "24"
